name: Daily ReloLead Ingestion Pipeline

on:
  schedule:
    # Runs Monday through Saturday at 14:00 UTC (6:00 AM PST)
    - cron: '0 14 * * 1-6'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Daily Scraper
        run: |
          python scraper.py

      - name: Commit & Push Updated Daily Leads
        run: |
          git config --global user.name 'ReloLead Bot'
          git config --global user.email 'bot@relolead.com'
          git add daily_leads.json
          git commit -m "Auto-update daily verified leads [$(date +'%Y-%m-%d')]" || exit 0
          git push
